<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Burger Couple</title>
<!-- noindex: que Google no guarde esta página de error como si fuera contenido. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141116">
<link rel="icon" href="/imagenes/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/estilos.css">
</head>
<body>
<!--
  Página de error con la voz de la marca (frase propuesta en el PDF), pero con
  la salida bien clara: el chiste nunca tapa el botón para volver.
-->
<main class="error">
  <div class="damero damero--rosa" aria-hidden="true"></div>
  <div class="contenedor error__contenido">
    <p class="rotulo">Error 404 · Sin señal</p>
    <h1 class="portada__titulo">Loco Piña se comió <span>esta página</span></h1>
    <p class="portada__bajada">La dirección que buscás no existe o cambió de lugar.</p>
    <a class="boton boton--amarillo" href="/">Volver al inicio</a>
  </div>
</main>
</body>
</html>
